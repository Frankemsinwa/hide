[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hide-cli"
version = "0.1.0"
description = "A secure, zero-knowledge local encrypted vault CLI for Windows"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Frank" }]
dependencies = [
    "cryptography>=42.0.0",
    "argon2-cffi>=23.1.0",
    "click>=8.1.7",
    "rich>=13.7.0",
    "pydantic>=2.6.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pyinstaller>=6.4.0"
]

[project.scripts]
hide = "hide.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
